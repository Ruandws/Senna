[build-system]
requires = ["setuptools>=72"]
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------------------------
# Metadados do projeto
# ---------------------------------------------------------------------------
[project]
name = "senna"
version = "0.1.0"
description = "Automações web para gestão de usuários em sistemas hospitalares"
readme = "README.md"
requires-python = ">=3.14"

# Versões exatas para garantir reprodutibilidade em instalações desktop.
# Qualquer atualização deve ser deliberada e testada antes do commit.
dependencies = [
    "playwright==1.58.0",
    "customtkinter==5.2.2",
    "pandas==3.0.1",
    "openpyxl>=3.1",        # backend obrigatório para pandas ler/escrever XLSX (RF-05)
    "python-dotenv>=1.0",   # carregamento de .env para credenciais (RF-06)
]

[project.scripts]
senna = "senna.main:main"

# ---------------------------------------------------------------------------
# Dependências de desenvolvimento
# Instalar com: pip install -e ".[dev]"
# ---------------------------------------------------------------------------
[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-playwright>=0.5",
    "ruff>=0.9",
]

# ---------------------------------------------------------------------------
# Descoberta de pacotes
# Encontra senna, senna.core, senna.interface, senna.systems.*, senna.utils
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["."]
include = ["senna*"]

# ---------------------------------------------------------------------------
# Configuração do pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]

addopts = [
    "--cov=senna",              # mede cobertura do pacote principal
    "--cov-report=term-missing",# exibe linhas não cobertas no terminal
    "--cov-fail-under=80",      # falha o build se cobertura < 80% (RNF-05)
    "-v",                       # output verboso por padrão
]

# Markers correspondem às três camadas de teste definidas na spec (§8 e §9).
# Uso:
#   pytest -m unit          → sem rede, sem browser
#   pytest -m integration   → requer ambiente staging
#   pytest -m e2e           → fluxo completo ponta a ponta
markers = [
    "unit: testes sem rede ou browser — lógica pura",
    "integration: testes contra ambiente staging com Playwright",
    "e2e: fluxo completo ponta a ponta",
]