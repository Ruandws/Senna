# Ruff — Linter e Formatter do Senna
# Documentação: https://docs.astral.sh/ruff/

# ---------------------------------------------------------------------------
# Alvo e escopo
# ---------------------------------------------------------------------------
target-version = "py314"

src = ["senna", "tests"]

exclude = [
    ".git",
    ".venv",
    "data/",
    "logs/",
    "docs/",
    "agents/",
]

line-length = 100

# ---------------------------------------------------------------------------
# Regras ativas
# Referência: https://docs.astral.sh/ruff/rules/
#
# E   → pycodestyle errors       (formatação e estilo básico)
# F   → Pyflakes                 (imports não usados, variáveis indefinidas)
# I   → isort                    (ordenação de imports)
# ANN → flake8-annotations       (type hints obrigatórios — alinhado §14.1)
# ---------------------------------------------------------------------------
[lint]
select = ["E", "F", "I", "ANN"]

ignore = [
    "ANN101",  # `self` não precisa de anotação
    "ANN102",  # `cls` não precisa de anotação
    "ANN401",  # permite `Any` quando estritamente necessário (ex: Result[T, E])
]

# Garante que imports de __future__ venham antes de qualquer outro
[lint.isort]
force-sort-within-sections = true
known-first-party = ["senna"]

# ---------------------------------------------------------------------------
# Formatter (substitui Black)
# ---------------------------------------------------------------------------
[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"